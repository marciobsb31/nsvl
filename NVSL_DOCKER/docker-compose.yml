services:
  frontend:
    build:
      context: ../NVSL_FRONTEND
      dockerfile: Dockerfile-frontend
      args:
        VITE_API_BASE_URL: /api
    image: nvsl-frontend:latest
    container_name: nvsl-frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    environment:
      - VITE_APP_NAME=NVSL
      - VITE_APP_ENV=dev
      - VITE_APP_VERSION=1.0.0
      - VITE_API_BASE_URL=http://localhost:8081/api
    networks:
      - nvsl-net
    # depends_on:
    #   backend:
    #     condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/index.html" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  backend:
    build:
      context: ../NVSL_BACKEND
      dockerfile: Dockerfile-backend
    image: nvsl-backend:latest
    container_name: nvsl-backend
    restart: unless-stopped
    ports:
      - "8081:81"
    volumes:
      - ../NVSL_BACKEND:/var/www/html
      - nvsl-vendor:/var/www/html/vendor
    environment:
      - APP_NAME=NVSL
      - APP_ENV=local
      - APP_KEY=base64:PpIGWDxZgmG46nScinKZZAGsQYjp7OFiqdMr6PWPOiY=
      - APP_DEBUG=true
      - APP_TIMEZONE=America/Sao_Paulo
      - APP_URL=http://localhost:8081
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nvsl
      - DB_USERNAME=nvsl_user
      - DB_PASSWORD=nvsl_password
      - CACHE_STORE=file
      - CACHE_PREFIX=nvsl_
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=sync
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:80,localhost:5174,localhost:5174,127.0.0.1
      - FRONTEND_URL=http://localhost:5174
      - GOVBR_FRONTEND_URL=http://localhost:5174
      - GOVBR_CLIENT_ID=h-nvsl.dev.mdh.gov.br
      - GOVBR_CLIENT_SECRET=qhdLnmHdKbNDdPYf52JOfk_N4L1RR1nrhO1H-Y2R9SMWQvnPGB4-iW74qTblMeqiYfrcfWniJ8rI1JKK31FYkg
      - GOVBR_REDIRECT_URI=http://localhost:8081/redirect-gov
      - GOVBR_SSO_URL=https://sso.staging.acesso.gov.br
      - GOVBR_SCOPES=openid email profile govbr_confiabilidades govbr_confiabilidades_idtoken
      - MAIL_MAILER=smtp
      - MAIL_ENCRYPTION=null
      - MAIL_FROM_ADDRESS=noreply@localhost
      - MAIL_FROM_NAME=NVSL
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
      - L5_SWAGGER_GENERATE_ALWAYS=true
      - JWT_SECRET=UXXcDJPYssDo03CtegksAfrWUUG3BTgjHL8ilHEWleRA8io8bjRB5SnuJGdqSwEZ
      - DB_SEED_PROFILE=demo
      - DB_SEED_ON_STARTUP=false
    networks:
      - nvsl-net
    depends_on:
      mailhog:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:81/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    container_name: nvsl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nvsl
      - POSTGRES_USER=nvsl_user
      - POSTGRES_PASSWORD=nvsl_password
    ports:
      - "5432:5432"
    volumes:
      - nvsl-pgdata:/var/lib/postgresql/data
    networks:
      - nvsl-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nvsl_user -d nvsl" ]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres-test:
    image: postgres:16-alpine
    container_name: nvsl-postgres-test
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nvsl_test
      - POSTGRES_USER=nvsl_test_user
      - POSTGRES_PASSWORD=nvsl_test_password
    ports:
      - "5433:5432"
    volumes:
      - nvsl-pgdata-test:/var/lib/postgresql/data
    networks:
      - nvsl-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nvsl_test_user -d nvsl_test" ]
      interval: 10s
      timeout: 5s
      retries: 5
      
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nvsl-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nvsl-net
  ssl-proxy:
    image: nginx:alpine
    container_name: nvsl-ssl-proxy
    restart: unless-stopped
    profiles:
      - ssl
    ports:
      - "443:443"
    volumes:
      - nvsl-ssl-certs:/etc/ssl/certs:ro
      - ./ssl-proxy/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nvsl-net
    depends_on:
      backend:
        condition: service_healthy
networks:
  nvsl-net:
    driver: bridge
    name: nvsl-net

volumes:
  nvsl-pgdata:
  nvsl-pgdata-test:
  nvsl-vendor:
  nvsl-ssl-certs:
