# ============================================================
# NVSL — Docker Compose Consolidado
# Repositório: DOCKER
#
# Orquestra todos os serviços do projeto:
#   - frontend  : Vue 3/Vite via Nginx (:80)
#   - backend   : Laravel 12 + PHP-FPM + Nginx (:8081)
#   - postgres  : PostgreSQL 16 (:5432)
#   - redis     : Redis 7 (:6379)
#
# ATENÇÃO: Variáveis hardcoded conforme requisito do projeto.
# Em produção, utilizar Vault ou AWS Secrets Manager.
# ============================================================

services:

  # -----------------------------------------------------------
  # Frontend — Vue 3 + Nginx
  # -----------------------------------------------------------
  frontend:
    build:
      context: ../NVSL_FRONTEND
      dockerfile: Dockerfile-frontend
      args:
        VITE_API_BASE_URL: /api
    image: nvsl-frontend:latest
    container_name: nvsl-frontend
    restart: unless-stopped
    ports:
      - "5174:8080"
    environment:
      - VITE_APP_NAME=NVSL
      - VITE_APP_ENV=development
      - VITE_APP_VERSION=1.0.0
      - VITE_API_BASE_URL=/api
    networks:
      - nvsl-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/index.html" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # -----------------------------------------------------------
  # Backend — Laravel 12 + PHP-FPM + Nginx
  # -----------------------------------------------------------
  backend:
    build:
      context: ../NVSL_BACKEND
      dockerfile: Dockerfile-backend
    image: nvsl-backend:latest
    container_name: nvsl-backend
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      # -- Aplicação --
      - APP_NAME=NVSL
      - APP_ENV=local
      - APP_KEY=base64:PpIGWDxZgmG46nScinKZZAGsQYjp7OFiqdMr6PWPOiY=
      - APP_DEBUG=true
      - APP_TIMEZONE=America/Sao_Paulo
      - APP_URL=http://localhost:8081
      # -- Banco de Dados --
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=nvsl
      - DB_USERNAME=nvsl_user
      - DB_PASSWORD=nvsl_password
      # -- Cache / Sessão / Filas --
      - CACHE_STORE=redis
      - CACHE_PREFIX=nvsl_
      - SESSION_DRIVER=redis
      - SESSION_LIFETIME=120
      - QUEUE_CONNECTION=sync
      - REDIS_HOST=redis
      - REDIS_PASSWORD=null
      - REDIS_PORT=6379
      - REDIS_CLIENT=predis
      # -- Sanctum --
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:80,localhost:5174,localhost:5176,127.0.0.1
      # URL do frontend Vue (Vite dev = 5176). Após GOV.BR, o callback redireciona para esta origem + /login#...
      - FRONTEND_URL=http://localhost:5176
      - GOVBR_FRONTEND_URL=http://localhost:5176
      # -- GOV.BR SSO (homologação: sso.staging.acesso.gov.br) —
      # redirect_uri DEVE ser idêntico ao cadastrado no MGI para este client_id (inclui http/https e porta).
      # Local: http://localhost:8081/redirect-gov | Via hosts+HTTPS: https://h-nvsl.dev.mdh.gov.br/redirect-gov
      - GOVBR_CLIENT_ID=h-nvsl.dev.mdh.gov.br
      - GOVBR_CLIENT_SECRET=qhdLnmHdKbNDdPYf52JOfk_N4L1RR1nrhO1H-Y2R9SMWQvnPGB4-iW74qTblMeqiYfrcfWniJ8rI1JKK31FYkg
      - GOVBR_REDIRECT_URI=http://localhost:8081/redirect-gov
      - GOVBR_SSO_URL=https://sso.staging.acesso.gov.br
      - GOVBR_SCOPES=openid email profile govbr_confiabilidades govbr_confiabilidades_idtoken
      # -- E-mail (log em dev, SMTP em produção) --
      - MAIL_MAILER=log
      - MAIL_FROM_ADDRESS=noreply@nvsl.gov.br
      - MAIL_FROM_NAME=NVSL
      # -- Swagger --
      - L5_SWAGGER_GENERATE_ALWAYS=true
    networks:
      - nvsl-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://localhost:80/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # -----------------------------------------------------------
  # Banco de Dados — PostgreSQL 16
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nvsl-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nvsl
      - POSTGRES_USER=nvsl_user
      - POSTGRES_PASSWORD=nvsl_password
    ports:
      - "5432:5432"
    volumes:
      - nvsl-pgdata:/var/lib/postgresql/data
    networks:
      - nvsl-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nvsl_user -d nvsl" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------
  # Cache — Redis 7
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nvsl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nvsl-net
  # -----------------------------------------------------------
  # SSL Proxy — HTTPS para testes com GOV.BR em localhost
  # Redireciona https://h-nvsl.dev.mdh.gov.br → backend:80
  # -----------------------------------------------------------
  ssl-proxy:
    image: nginx:alpine
    container_name: nvsl-ssl-proxy
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - nvsl-ssl-certs:/etc/ssl/certs:ro
      - ./ssl-proxy/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nvsl-net
    depends_on:
      backend:
        condition: service_healthy

  # -------------------------------------------------------
  # Rede interna
  # -------------------------------------------------------
networks:
  nvsl-net:
    driver: bridge
    name: nvsl-net

# -------------------------------------------------------
# Volumes persistentes
# -------------------------------------------------------
volumes:
  nvsl-pgdata:
  nvsl-ssl-certs:
    external: true
