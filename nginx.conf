server {
    listen 80;
    server_name _;

    # Raiz dos arquivos servidos
    root /usr/share/nginx/html;
    index index.html;

    # -------------------------------------------------------
    # Cabeçalhos de Segurança
    # -------------------------------------------------------

    # Content Security Policy — restringe fontes de recursos
    add_header Content-Security-Policy "default-src 'self'; \
        script-src 'self' 'unsafe-inline'; \
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
        font-src 'self' https://fonts.gstatic.com data:; \
        img-src 'self' data: https: blob:; \
        connect-src 'self' https://sso.staging.acesso.gov.br https://sso.acesso.gov.br; \
        frame-ancestors 'none'; \
        form-action 'self';" always;

    # Impede clickjacking
    add_header X-Frame-Options "DENY" always;

    # Impede MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Política de referência segura
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissões de recursos do navegador
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS (só ativar se tiver HTTPS configurado no proxy/LB)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -------------------------------------------------------
    # Compressão Gzip
    # -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # -------------------------------------------------------
    # Cache de Assets Estáticos
    # -------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------------------------------------------------------
    # SPA Fallback — todas as rotas apontam para index.html
    # -------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Esconde versão do Nginx
    server_tokens off;
}
